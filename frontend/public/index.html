<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Morpheus Note - Mensajes que despiertan en el momento correcto." />
  <title>Morpheus Note</title>

  <link rel="icon" type="image/png" href="./morpheus-note-icon.png" />
  <link rel="apple-touch-icon" href="./morpheus-note-icon.png" />
  <link rel="stylesheet" href="../src/css/styles.css" />
  <link rel="stylesheet" href="../src/css/fx.css" />
  <link id="mnDarkSkin" rel="stylesheet" href="../src/css/futuristic.css" />
  <meta name="theme-color" content="#04050d" />
  <script>
    try {
      if (localStorage.getItem("mn-theme") === "light") {
        document.documentElement.dataset.theme = "light";
        document.addEventListener("DOMContentLoaded", function () {
          var skin = document.getElementById("mnDarkSkin");
          if (skin) skin.disabled = true;
        });
      }
    } catch (e) {}
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>

<body>
  <div id="app"></div>

  <script type="module" src="../src/js/app.js"></script>
</body>
</html>
